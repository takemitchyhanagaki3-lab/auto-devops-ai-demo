name: AutoDevOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "project_type=node" >> $GITHUB_OUTPUT
          else
            echo "project_type=unknown" >> $GITHUB_OUTPUT
          fi

      # Only run Node steps if package.json exists
      - name: Setup Node.js
        if: steps.detect.outputs.project_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (Node)
        if: steps.detect.outputs.project_type == 'node'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests
        if: steps.detect.outputs.project_type == 'node'
        run: |
          if npm run -s test >/dev/null 2>&1; then
            npm test
          else
            echo "⚠ No tests found. Skipping."
          fi

      - name: Build
        if: steps.detect.outputs.project_type == 'node'
        run: |
          if npm run -s build >/dev/null 2>&1; then
            npm run build
          else
            echo "⚠ No build script. Skipping build."
          fi

      # No Node project? Just pass CI.
      - name: No Build Needed
        if: steps.detect.outputs.project_type == 'unknown'
        run: echo "No package.json found → Passing CI automatically."
